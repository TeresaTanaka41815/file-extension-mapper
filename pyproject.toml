[project]
name = "file-extension-mapper"
version = "0.1.1"
description = "Renames files in a directory by mapping old extensions to new ones with conflict resolution."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
